repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-yaml
  - repo: https://github.com/pazmivaniye/pre-commit-hooks
    rev: 3c741d565bea8ed8ce0c3beb6cbe800c5505cee7
    hooks:
      - id: check-chars
      - id: check-filenames
      - id: check-line-length
